name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: checkout Code
      uses: actions/checkout@v5

    - name: set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: run tests
      run: python -m pytest -q
