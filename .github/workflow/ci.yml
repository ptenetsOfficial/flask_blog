name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: checkout Code
      uses: actions/checkout@v3

    - name: set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: install dependencies
      run: 
        python -m pip install --upgrade pip
        pip install -r requirements.txt
